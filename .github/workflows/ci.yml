name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Validate flake
        run: nix flake check

      - name: Nix formatting (alejandra)
        run: nix run nixpkgs#alejandra -- --check .

      - name: Nix linting (statix)
        run: nix run nixpkgs#statix -- check .

      - name: Unused Nix code (deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Shell formatting (shfmt)
        run: nix run nixpkgs#shfmt -- -i 2 -d bootstrap.sh

      - name: Shell linting (shellcheck)
        run: nix run nixpkgs#shellcheck -- bootstrap.sh
